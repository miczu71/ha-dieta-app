name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dieta/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dieta/app/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

  docker:
    # Obraz budowany tak jak przez Supervisora (lokalnie z dieta/Dockerfile). Wyłapuje brak kół
    # binarnych pod musl (--only-binary) dla obu architektur add-onu.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build aarch64
        uses: docker/build-push-action@v6
        with:
          context: dieta
          platforms: linux/arm64
          push: false
      - name: Build amd64
        uses: docker/build-push-action@v6
        with:
          context: dieta
          platforms: linux/amd64
          load: true
          tags: dieta:ci
      - name: Smoke test
        run: |
          docker run -d --name dieta -p 8099:8099 \
            -e DIETA_OPTIONS_PATH=/nonexistent -e DIETA_DEV=1 -e DIETA_DATA_DIR=/tmp dieta:ci
          for i in $(seq 1 20); do
            curl -sf localhost:8099/healthz && exit 0
            sleep 1
          done
          docker logs dieta
          exit 1
