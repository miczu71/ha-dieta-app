<h1>Zupa testowa</h1>
<div class="template-article">
<div class="article__content">
<p>SKŁADNIKI:</p>
<p>marchew – 500 g</p>
<p>cebula – 1 szt.</p>
<p>UŻYTE WYPOSAŻENIE:</p>
<p>garnek</p>
<p>PRZYGOTOWANIE</p>
<p>Warzywa ugotuj w wodzie.</p>
<p>Zupa z 500 g warzyw będzie mieć 400 kcal, a makroskładniki będą wyglądały tak:</p>
<p>20 g białka, 30 g węglowodanów oraz 10 g tłuszczu.</p>
