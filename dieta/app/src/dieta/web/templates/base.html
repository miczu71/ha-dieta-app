<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }} — Dieta</title>
<link rel="icon" href="{{ root }}static/icon.svg?v={{ version }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ root }}static/app.css?v={{ version }}">
</head>
<body class="dz">
<main class="dz-page">
<header class="dz-head">
  <h1 class="dz-title">{{ page_title }}</h1>
  <span class="dz-ver dz-num">v{{ version }}</span>
</header>
<nav class="dz-nav" aria-label="Sekcje">
  <a href="{{ root or './' }}"{% if section == 'profile' %} aria-current="page"{% endif %}>Profile</a>
  <a href="{{ root }}kupujemy"{% if section == 'kupujemy' %} aria-current="page"{% endif %}>Co kupujemy{% if queue_size %} <span class="dz-chip dz-num">{{ queue_size }}</span>{% endif %}</a>
  <a href="{{ root }}katalog"{% if section == 'katalog' %} aria-current="page"{% endif %}>Katalog</a>
</nav>
{% block content %}{% endblock %}
<p class="dz-note">Wartości są szacunkowe i nie stanowią porady medycznej.</p>
</main>
</body>
</html>
