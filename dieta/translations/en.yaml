configuration:
  log_level:
    name: Log level
    description: Add-on log verbosity.
  person_1_name:
    name: Person 1 name
    description: Shown in the panel. The rest of the profile is entered in the panel and stays in /data.
  person_2_name:
    name: Person 2 name
    description: Same, for the second person.
  zakupy_url:
    name: Zakupy address
    description: Address of the Zakupy add-on, e.g. http://f0987e0f-lidl:8099 (Supervisor network hostname).
  zakupy_token:
    name: Zakupy API token
    description: The same token as the api_token option of the Zakupy add-on. Empty = sync disabled.
  llm_url:
    name: LLM address (optional)
    description: Base URL of an OpenAI-compatible server used to map product names to ingredients. Empty = no AI.
  llm_key:
    name: LLM key (optional)
    description: Key for the LLM server from llm_url.
  refresh_time:
    name: Nightly refresh time
    description: HH:MM format, e.g. 03:30.
  shelf_fresh_days:
    name: Days — fresh
    description: Days after the last purchase during which a fresh ingredient counts as probably at home.
  shelf_chilled_days:
    name: Days — chilled
    description: Same, for chilled ingredients.
  shelf_dry_days:
    name: Days — dry
    description: Same, for dry goods.
  shelf_frozen_days:
    name: Days — frozen
    description: Same, for frozen goods.
  crawl_daily_limit:
    name: Daily limit of new recipes
    description: How many new recipe pages to fetch per day from a single source (at most 1 request per second).
  familiar_threshold:
    name: Familiarity threshold (%)
    description: Share of known ingredients from which a recipe counts as "familiar" (default catalog and planner filter).
  sources:
    name: Recipe sources
    description: Enabled catalog sources (respo, lidl, policzona, aniagotuje).
  slot_breakfast_pct:
    name: Breakfast (% of daily kcal)
    description: Share of breakfast in daily kcal for the planner. 0 = slot disabled. Slots must sum to at most 100, the rest is for meals outside the plan.
  slot_lunch_pct:
    name: Lunch (% of daily kcal)
    description: Share of lunch. 0 = slot disabled.
  slot_dinner_pct:
    name: Dinner (% of daily kcal)
    description: Share of dinner. 0 = slot disabled.
  slot_snack1_pct:
    name: Morning snack (% of daily kcal)
    description: Share of the morning snack. 0 = slot disabled.
  slot_snack2_pct:
    name: Afternoon snack (% of daily kcal)
    description: Share of the afternoon snack. 0 = slot disabled.
  cook_days:
    name: Cooking days
    description: Weekdays on which cooking sessions may start (mon..sun).
  max_minutes_weekday:
    name: Max cooking time on weekdays (min)
    description: Longer recipes are penalized when a session starts on a weekday.
  session_days_max:
    name: Max days per session
    description: For how many consecutive days one cooking session lasts at most (also limited by recipe storage life).
  discovery:
    name: Discovery (0-3)
    description: How many sessions per week come from recipes not bought yet (0 = familiar only).
