configuration:
  log_level:
    name: Poziom logów
    description: Szczegółowość logów add-onu.
  person_1_name:
    name: Imię osoby 1
    description: Wyświetlane w panelu. Pozostałe dane profilu wpisujesz w panelu i zostają w /data.
  person_2_name:
    name: Imię osoby 2
    description: Jak wyżej, dla drugiej osoby.
  zakupy_url:
    name: Adres Zakupów
    description: Adres add-onu Zakupy, np. http://f0987e0f-lidl:8099 (hostname w sieci Supervisora).
  zakupy_token:
    name: Token API Zakupów
    description: Ten sam token co w opcji api_token add-onu Zakupy. Puste = synchronizacja wyłączona.
  llm_url:
    name: Adres LLM (opcjonalnie)
    description: Bazowy adres serwera zgodnego z OpenAI do mapowania nazw produktów na składniki. Puste = bez AI.
  llm_key:
    name: Klucz LLM (opcjonalnie)
    description: Klucz do serwera LLM z opcji llm_url.
  refresh_time:
    name: Godzina nocnego odświeżania
    description: Format HH:MM, np. 03:30.
  push_notify:
    name: Usługa powiadomień (poranny plan)
    description: Nazwa usługi notify bez prefiksu, np. family (notify.family). Puste = poranny push wyłączony.
  push_time:
    name: Godzina porannego powiadomienia
    description: Format HH:MM, np. 07:00. Wysyłane raz dziennie, tylko gdy zatwierdzony plan ma posiłki na dziś.
  shelf_fresh_days:
    name: Dni — świeże
    description: Ile dni po ostatnim zakupie składnik świeży uznajemy za prawdopodobnie w domu.
  shelf_chilled_days:
    name: Dni — chłodnia
    description: Jak wyżej, dla składników z chłodni.
  shelf_dry_days:
    name: Dni — suche
    description: Jak wyżej, dla produktów suchych.
  shelf_frozen_days:
    name: Dni — mrożonki
    description: Jak wyżej, dla mrożonek.
  crawl_daily_limit:
    name: Dzienny limit nowych przepisów
    description: Ile nowych stron przepisów pobrać dziennie z jednego źródła (≤ 1 zapytanie na sekundę).
  familiar_threshold:
    name: Próg znajomości (%)
    description: Od jakiego odsetka znanych składników przepis uznajemy za „znajomy" (domyślny filtr katalogu i planera).
  sources:
    name: Źródła przepisów
    description: Włączone źródła katalogu (respo, lidl, policzona, aniagotuje).
  slot_breakfast_pct:
    name: Śniadanie (% kcal dnia)
    description: Udział śniadania w kcal dnia w planerze. 0 = slot wyłączony. Suma slotów ≤ 100, reszta to posiłki spoza planu.
  slot_lunch_pct:
    name: Obiad (% kcal dnia)
    description: Udział obiadu. 0 = slot wyłączony.
  slot_dinner_pct:
    name: Kolacja (% kcal dnia)
    description: Udział kolacji. 0 = slot wyłączony.
  slot_snack1_pct:
    name: II śniadanie (% kcal dnia)
    description: Udział drugiego śniadania. 0 = slot wyłączony.
  slot_snack2_pct:
    name: Podwieczorek (% kcal dnia)
    description: Udział podwieczorku. 0 = slot wyłączony.
  cook_days:
    name: Dni gotowania
    description: Dni tygodnia, w które zaczynają się sesje gotowania (mon..sun).
  max_minutes_weekday:
    name: Maks. czas gotowania w dni robocze (min)
    description: Dłuższe przepisy dostają karę, gdy sesja zaczyna się w dzień roboczy.
  session_days_max:
    name: Maks. dni jednej sesji
    description: Na ile kolejnych dni najwyżej starcza jedna sesja gotowania (z uwzględnieniem trwałości przepisu).
  discovery:
    name: Odkrywanie (0–3)
    description: Ile sesji w tygodniu wybrać spośród przepisów jeszcze niekupowanych (0 = tylko znajome).
  todo_entity:
    name: Lista todo w Home Assistant
    description: Encja todo (np. todo.zakupy), do której przycisk „Wyślij do todo" na ekranie Lista dodaje pozycje. Puste = przycisk ukryty.
  cheaper_mode:
    name: Tryb „taniej"
    description: Planer premiuje przepisy ze składników, które prawdopodobnie masz już w domu. Wyłączone = plan bez zmian.
  zepp_enabled:
    name: Konto Zepp
    description: Pokazuje w Profilach sekcję „Konto Zepp” (import wagi i składu ciała). Wyłączone = sekcja ukryta, dane zostają.
