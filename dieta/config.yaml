name: "Dieta"
version: "0.5.2"
slug: dieta
description: "Planer posiłków wielodniowych z celami kcal dla dwóch osób, połączony z zakupami"
url: "https://github.com/miczu71/ha-dieta-app"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:silverware-fork-knife
panel_title: "Dieta"
panel_admin: true
homeassistant_api: true
options:
  log_level: info
  person_1_name: ""
  person_2_name: ""
  zakupy_url: ""
  zakupy_token: ""
  llm_url: ""
  llm_key: ""
  refresh_time: "03:30"
  push_notify: "family"
  push_time: "07:00"
  shelf_fresh_days: 4
  shelf_chilled_days: 10
  shelf_dry_days: 30
  shelf_frozen_days: 60
  crawl_daily_limit: 150
  familiar_threshold: 50
  sources:
    - respo
    - lidl
    - policzona
    - aniagotuje
  slot_breakfast_pct: 25
  slot_lunch_pct: 35
  slot_dinner_pct: 30
  slot_snack1_pct: 0
  slot_snack2_pct: 0
  cook_days:
    - sat
    - sun
    - wed
  max_minutes_weekday: 45
  session_days_max: 4
  discovery: 1
  todo_entity: ""
  cheaper_mode: false
schema:
  log_level: "list(debug|info|warning|error)"
  person_1_name: "str?"
  person_2_name: "str?"
  zakupy_url: "str?"
  zakupy_token: "password?"
  llm_url: "str?"
  llm_key: "password?"
  refresh_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  push_notify: "match(^[a-z0-9_]*$)?"
  push_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  shelf_fresh_days: "int(1,365)"
  shelf_chilled_days: "int(1,365)"
  shelf_dry_days: "int(1,365)"
  shelf_frozen_days: "int(1,365)"
  crawl_daily_limit: "int(1,1000)"
  familiar_threshold: "int(0,100)"
  sources:
    - "list(respo|lidl|policzona|aniagotuje)"
  slot_breakfast_pct: "int(0,100)"
  slot_lunch_pct: "int(0,100)"
  slot_dinner_pct: "int(0,100)"
  slot_snack1_pct: "int(0,100)"
  slot_snack2_pct: "int(0,100)"
  cook_days:
    - "list(mon|tue|wed|thu|fri|sat|sun)"
  max_minutes_weekday: "int(10,240)"
  session_days_max: "int(1,7)"
  discovery: "int(0,3)"
  todo_entity: "match(^(todo\\.[a-z0-9_]+)?$)?"
  cheaper_mode: bool
