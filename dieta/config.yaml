name: "Dieta"
version: "0.0.1"
slug: dieta
description: "Planer posiłków wielodniowych z celami kcal dla dwóch osób, połączony z zakupami"
url: "https://github.com/miczu71/ha-dieta-app"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:silverware-fork-knife
panel_title: "Dieta"
panel_admin: true
options:
  log_level: info
  person_1_name: ""
  person_2_name: ""
  zakupy_url: ""
  zakupy_token: ""
  llm_url: ""
  llm_key: ""
  refresh_time: "03:30"
  shelf_fresh_days: 4
  shelf_chilled_days: 10
  shelf_dry_days: 30
  shelf_frozen_days: 60
  crawl_daily_limit: 150
  familiar_threshold: 70
  sources:
    - respo
    - lidl
    - policzona
schema:
  log_level: "list(debug|info|warning|error)"
  person_1_name: "str?"
  person_2_name: "str?"
  zakupy_url: "str?"
  zakupy_token: "password?"
  llm_url: "str?"
  llm_key: "password?"
  refresh_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  shelf_fresh_days: "int(1,365)"
  shelf_chilled_days: "int(1,365)"
  shelf_dry_days: "int(1,365)"
  shelf_frozen_days: "int(1,365)"
  crawl_daily_limit: "int(1,1000)"
  familiar_threshold: "int(0,100)"
  sources:
    - "list(respo|lidl|policzona)"
